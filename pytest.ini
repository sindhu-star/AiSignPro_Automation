[pytest]
base_url = https://cpastaging.aisignpro.com/
testpaths = tests
markers =
       e2e: end-to-end business flow
       demo: intentionally failing test used to prove screenshots in reports
addopts =
    -v
    -m "not demo"
    --browser chromium
    --screenshot only-on-failure
    --tracing retain-on-failure
    --output reports/artifacts
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results
    --clean-alluredir
